server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://localhost:3100/loki/api/v1/push

scrape_configs:
  - job_name: bench_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: llm_bench
          __path__: /content/llm-inference-benchmark-suite/logs/*.log

    pipeline_stages:
      - json:
          expressions:
            level: level
            technique: technique
            phase: phase
            message: message
      - labels:
          level:
          technique:
          phase:
